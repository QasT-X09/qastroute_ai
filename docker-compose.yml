version: '3.8'

services:
  qastroute:
    build: .
    container_name: qastroute-ai-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - REQUIRE_AUTH=true
      - QASTROUTE_API_KEY=${QASTROUTE_API_KEY:-qast-prod-key}
      - FCC_LOCAL_GATEWAY=http://host.docker.internal:8082
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
